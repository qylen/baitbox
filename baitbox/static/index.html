<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaitBox | Honeypot Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-200 font-mono">
    <div x-data="baitbox()" x-init="init()" class="min-h-screen p-6 lg:p-8">
        <header class="mb-8 flex flex-col gap-4 border-b border-slate-800 pb-6 lg:flex-row lg:items-end lg:justify-between">
            <div>
                <h1 class="text-4xl font-black tracking-tight text-emerald-400">🪤 BaitBox</h1>
                <p class="text-slate-400">Real-time honeypot telemetry for SSH and web probes.</p>
            </div>
            <div class="rounded-full border px-4 py-2 text-sm" :class="connected ? 'border-emerald-700 bg-emerald-950 text-emerald-300' : 'border-amber-700 bg-amber-950 text-amber-300'">
                <span x-text="connected ? 'Live feed connected' : 'Reconnecting feed…'"></span>
            </div>
        </header>

        <section class="mb-6 grid grid-cols-1 gap-4 md:grid-cols-3">
            <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                <p class="text-sm text-slate-500">Total events</p>
                <p class="mt-2 text-3xl font-bold text-white" x-text="events.length"></p>
            </div>
            <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                <p class="text-sm text-slate-500">SSH commands</p>
                <p class="mt-2 text-3xl font-bold text-purple-300" x-text="events.filter(e => e.event_type === 'command').length"></p>
            </div>
            <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                <p class="text-sm text-slate-500">HTTP probes</p>
                <p class="mt-2 text-3xl font-bold text-blue-300" x-text="events.filter(e => e.protocol === 'HTTP').length"></p>
            </div>
        </section>

        <div class="grid grid-cols-1 gap-6 xl:grid-cols-3">
            <main class="xl:col-span-2 rounded-xl border border-slate-800 bg-slate-900 p-4 shadow-2xl">
                <div class="mb-4 flex items-center justify-between">
                    <h2 class="text-xl font-bold text-slate-100">Live Attack Feed</h2>
                    <button class="rounded bg-slate-800 px-3 py-1 text-xs text-slate-300 hover:bg-slate-700" @click="events = []; calculateStats()">Clear view</button>
                </div>
                <div class="h-[620px] overflow-y-auto rounded-lg bg-black/40 p-4 text-sm ring-1 ring-slate-800">
                    <template x-for="event in newestEvents" :key="event.id || event.timestamp">
                        <article class="mb-3 rounded-lg border border-slate-800 bg-slate-950/80 p-3">
                            <div class="flex flex-wrap items-center gap-2">
                                <span x-text="formatTime(event.timestamp)" class="text-xs text-slate-500"></span>
                                <span class="rounded px-2 py-0.5 text-xs font-bold" :class="event.protocol === 'SSH' ? 'bg-purple-950 text-purple-300' : 'bg-blue-950 text-blue-300'" x-text="event.protocol"></span>
                                <span class="font-bold text-red-300" x-text="event.src_ip"></span>
                                <span class="rounded bg-slate-800 px-2 py-0.5 text-xs text-slate-300" x-text="event.event_type"></span>
                            </div>
                            <pre class="mt-2 whitespace-pre-wrap break-all pl-1 text-slate-300" x-text="formatPayload(event)"></pre>
                        </article>
                    </template>
                    <div x-show="events.length === 0" class="mt-24 text-center text-slate-500">
                        Waiting for attackers to take the bait...
                    </div>
                </div>
            </main>

            <aside class="space-y-6">
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-4 shadow-2xl">
                    <h2 class="mb-4 text-xl font-bold text-slate-100">Top Attacker IPs</h2>
                    <template x-for="ip in topIps" :key="ip.ip">
                        <div class="mb-2 flex justify-between rounded bg-slate-950 px-3 py-2 text-sm">
                            <span class="text-red-300" x-text="ip.ip"></span>
                            <span class="text-slate-400" x-text="ip.count + ' hits'"></span>
                        </div>
                    </template>
                    <p x-show="topIps.length === 0" class="text-sm text-slate-500">No source IPs yet.</p>
                </div>
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-4 shadow-2xl">
                    <h2 class="mb-4 text-xl font-bold text-slate-100">Top SSH Passwords</h2>
                    <template x-for="pwd in topPasswords" :key="pwd.password">
                        <div class="mb-2 flex justify-between rounded bg-slate-950 px-3 py-2 text-sm">
                            <span class="text-yellow-300" x-text="pwd.password"></span>
                            <span class="text-slate-400" x-text="pwd.count + ' tries'"></span>
                        </div>
                    </template>
                    <p x-show="topPasswords.length === 0" class="text-sm text-slate-500">No captured passwords yet.</p>
                </div>
            </aside>
        </div>
    </div>

    <script>
        function baitbox() {
            return {
                events: [], topIps: [], topPasswords: [], ws: null, connected: false,
                get newestEvents() { return [...this.events].reverse(); },
                init() {
                    fetch('/api/events').then(r => r.json()).then(data => { this.events = data; this.calculateStats(); });
                    this.connectFeed();
                },
                connectFeed() {
                    const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
                    this.ws = new WebSocket(`${scheme}://${window.location.host}/ws/feed`);
                    this.ws.onopen = () => { this.connected = true; };
                    this.ws.onclose = () => { this.connected = false; setTimeout(() => this.connectFeed(), 2000); };
                    this.ws.onmessage = (message) => {
                        this.events.push(JSON.parse(message.data));
                        if (this.events.length > 200) this.events.shift();
                        this.calculateStats();
                    };
                },
                calculateStats() {
                    const countValues = (keyFn) => Object.entries(this.events.reduce((acc, event) => {
                        const key = keyFn(event);
                        if (key) acc[key] = (acc[key] || 0) + 1;
                        return acc;
                    }, {})).sort((a, b) => b[1] - a[1]).slice(0, 5);
                    this.topIps = countValues(e => e.src_ip).map(([ip, count]) => ({ip, count}));
                    this.topPasswords = countValues(e => e.event_type === 'auth_attempt' && e.payload ? e.payload.password : null).map(([password, count]) => ({password, count}));
                },
                formatTime(ts) { return ts ? new Date(ts).toLocaleString() : ''; },
                formatPayload(event) {
                    if (event.event_type === 'auth_attempt') return `user=${event.payload.username} password=${event.payload.password}`;
                    if (event.event_type === 'command') return `$ ${event.payload.command}`;
                    if (event.protocol === 'HTTP') return `${event.payload.method} ${event.payload.path}${event.payload.query ? '?' + event.payload.query : ''}\n${JSON.stringify(event.payload.body || {}, null, 2)}`;
                    return JSON.stringify(event.payload, null, 2);
                }
            }
        }
    </script>
</body>
</html>
